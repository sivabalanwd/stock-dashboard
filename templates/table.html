<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Table View</title>

    <link rel="stylesheet" href="/static/css/style.css">

</head>

<body style="background-color: rgb(184, 255, 185);">

<div class="container">

    <!-- HEADER -->
    <div class="header">

        <div class="title-section">
            <h1>Instruments Table View</h1>
            <p>Category wise stock availability</p>
        </div>

        <button class="table-btn" onclick="goBack()">
            Dashboard
        </button>

    </div>

    <!-- SEARCH -->
    <input
        type="text"
        id="tableSearch"
        placeholder="Search instruments..."
        class="search-bar"
        onkeyup="searchTable()"
    >

    <!-- FILTERS -->
    <div class="filter-bar">

        <button onclick="sortAZ()" class="table-btn">A → Z</button>
        <button onclick="sortZA()" class="table-btn">Z → A</button>
        <button onclick="sortQtyLow()" class="table-btn">Qty ↑</button>
        <button onclick="sortQtyHigh()" class="table-btn">Qty ↓</button>

        <select id="categoryFilter" onchange="filterCategory()" class="search-bar">
            <option value="all">All Categories</option>
        </select>

    </div>

    <!-- TABLE -->
    <div class="table-container">

        <table>

            <thead>
                <tr>
                    <th>Category</th>
                    <th>Instrument</th>
                    <th>Quantity</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="tableBody"></tbody>

        </table>

    </div>

</div>

<script>

let allData = [];

const board = window.location.pathname.split("/").pop();


// =========================
// LOAD DATA
// =========================
async function loadTable() {

    let res = await fetch(`/items/${board}`);
    allData = await res.json();

    populateCategory(allData);
    renderTable(allData);
}


// =========================
// RENDER TABLE
// =========================
function renderTable(data) {

    let body = document.getElementById("tableBody");
    body.innerHTML = "";

    data.forEach(item => {

        let status = "";
        let cls = "";

        if (item.quantity > item.alert_limit) {
            status = "Available";
            cls = "available";
        }
        else if (item.quantity == item.alert_limit) {
            status = "limited";
            cls = "medium";
        }
        else {
            status = "Low Stock";
            cls = "low";
        }

        body.innerHTML += `
            <tr>
                <td>${item.category}</td>
                <td>${item.name}</td>
                <td>${item.quantity}</td>
                <td><span class="${cls}">${status}</span></td>
            </tr>
        `;
    });
}


// =========================
// SEARCH
// =========================
function searchTable() {

    let val = document.getElementById("tableSearch").value.toLowerCase();

    let filtered = allData.filter(i =>
        i.name.toLowerCase().includes(val) ||
        i.category.toLowerCase().includes(val)
    );

    renderTable(filtered);
}


// =========================
// CATEGORY FILTER
// =========================
function populateCategory(data) {

    let select = document.getElementById("categoryFilter");

    let cats = [...new Set(data.map(i => i.category))];

    select.innerHTML = `<option value="all">All Categories</option>`;

    cats.forEach(c => {
        select.innerHTML += `<option value="${c}">${c}</option>`;
    });
}

function filterCategory() {

    let val = document.getElementById("categoryFilter").value;

    if (val === "all") {
        renderTable(allData);
    } else {
        renderTable(allData.filter(i => i.category === val));
    }
}


// =========================
// SORTING
// =========================
function sortAZ() {
    renderTable([...allData].sort((a,b) => a.name.localeCompare(b.name)));
}

function sortZA() {
    renderTable([...allData].sort((a,b) => b.name.localeCompare(a.name)));
}

function sortQtyLow() {
    renderTable([...allData].sort((a,b) => a.quantity - b.quantity));
}

function sortQtyHigh() {
    renderTable([...allData].sort((a,b) => b.quantity - a.quantity));
}


// =========================
// NAV BACK
// =========================
function goBack() {
    window.location.href = `/board/${board}`;
}


// =========================
// START
// =========================
loadTable();

</script>

</body>
</html>
