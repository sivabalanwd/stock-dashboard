<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Table View</title>

    <link rel="stylesheet"
          href="/static/css/style.css">

</head>

<body style="background-color: rgb(210, 255, 198);">

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="title-section">

            <h1>
                Instruments Table View
            </h1>

            <p>
                Category wise stock availability
            </p>

        </div>

        <button
            class="table-btn"
            onclick="goBack()"
        >
            Dashboard
        </button>

    </div>


    <!-- SEARCH -->

    <input
        type="text"
        id="tableSearch"
        placeholder="Search instruments..."
        class="search-bar"
        onkeyup="searchTable()"
    >


    <!-- FILTERS -->

    <div class="filter-bar"
         style="
         display:flex;
         gap:10px;
         flex-wrap:wrap;
         margin-top:20px;
         ">

        <button
            onclick="sortAZ()"
            class="table-btn"
        >
            A → Z
        </button>

        <button
            onclick="sortZA()"
            class="table-btn"
        >
            Z → A
        </button>

        <button
            onclick="sortQtyLow()"
            class="table-btn"
        >
            Qty ↑
        </button>

        <button
            onclick="sortQtyHigh()"
            class="table-btn"
        >
            Qty ↓
        </button>

        <select
            id="categoryFilter"
            onchange="filterCategory()"
            class="search-bar"
            style="max-width:220px;"
        >

            <option value="all">
                All Categories
            </option>

        </select>

    </div>


    <!-- TABLE -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>Category</th>

                    <th>Instrument</th>

                    <th>Quantity</th>

                    <th>Status</th>

                </tr>

            </thead>

            <tbody id="tableBody">

            </tbody>

        </table>

    </div>

</div>


<script>

let allData = [];

const board = window.location.pathname.split("/").pop();


// ==========================
// LOAD TABLE
// ==========================

async function loadTable() {

    let res = await fetch(`/items/${board}`);

    let data = await res.json();

    allData = data;

    populateCategory(data);

    renderTable(data);
}


// ==========================
// RENDER TABLE
// ==========================

function renderTable(data) {

    let tableBody =
        document.getElementById("tableBody");

    tableBody.innerHTML = "";

    data.forEach(item => {

        let status = "";

        let statusClass = "";

        if (item.quantity > item.alert_limit) {

            status = "Available";

            statusClass = "available";

        }

        else if (
            item.quantity == item.alert_limit
        ) {

            status = "Running Low";

            statusClass = "medium";

        }

        else {

            status = "Low Stock";

            statusClass = "low";
        }

        tableBody.innerHTML += `

        <tr>

            <td>${item.category}</td>

            <td>${item.name}</td>

            <td>${item.quantity}</td>

            <td>

                <span class="${statusClass}">
                    ${status}
                </span>

            </td>

        </tr>

        `;
    });
}


// ==========================
// SEARCH
// ==========================

function searchTable() {

    let input = document
        .getElementById("tableSearch")
        .value
        .toLowerCase();

    let filtered = allData.filter(item => {

        return (
            item.name.toLowerCase().includes(input)
            ||
            item.category.toLowerCase().includes(input)
        );

    });

    renderTable(filtered);
}


// ==========================
// CATEGORY FILTER
// ==========================

function populateCategory(data) {

    let select =
        document.getElementById("categoryFilter");

    let categories = [
        ...new Set(data.map(i => i.category))
    ];

    select.innerHTML =
        `<option value="all">All Categories</option>`;

    categories.forEach(cat => {

        select.innerHTML += `
            <option value="${cat}">
                ${cat}
            </option>
        `;
    });
}


function filterCategory() {

    let value =
        document.getElementById("categoryFilter").value;

    if (value === "all") {

        renderTable(allData);

    }

    else {

        let filtered = allData.filter(
            i => i.category === value
        );

        renderTable(filtered);
    }
}


// ==========================
// SORT A-Z
// ==========================

function sortAZ() {

    let sorted = [...allData].sort((a, b) =>
        a.name.localeCompare(b.name)
    );

    renderTable(sorted);
}


// ==========================
// SORT Z-A
// ==========================

function sortZA() {

    let sorted = [...allData].sort((a, b) =>
        b.name.localeCompare(a.name)
    );

    renderTable(sorted);
}


// ==========================
// SORT QTY LOW-HIGH
// ==========================

function sortQtyLow() {

    let sorted = [...allData].sort((a, b) =>
        a.quantity - b.quantity
    );

    renderTable(sorted);
}


// ==========================
// SORT QTY HIGH-LOW
// ==========================

function sortQtyHigh() {

    let sorted = [...allData].sort((a, b) =>
        b.quantity - a.quantity
    );

    renderTable(sorted);
}


// ==========================
// BACK
// ==========================

function goBack() {

    window.location.href =
        `/board/${board}`;
}


// ==========================
// START
// ==========================

loadTable();

</script>

</body>
</html>
