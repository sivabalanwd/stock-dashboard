<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{

            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background:linear-gradient(
                135deg,
                #0f172a,
                #1e293b,
                #334155
            );

            padding:20px;
        }

        .login-card{

            width:100%;
            max-width:420px;

            background:rgba(255,255,255,0.08);

            border:1px solid rgba(255,255,255,0.15);

            backdrop-filter:blur(12px);

            border-radius:25px;

            padding:35px;

            color:white;

            box-shadow:0 10px 30px rgba(0,0,0,0.3);
        }

        .logo{

            width:80px;
            height:80px;

            margin:auto;
            margin-bottom:20px;

            border-radius:50%;

            background:white;

            display:flex;
            align-items:center;
            justify-content:center;

            color:#0f172a;

            font-size:35px;
        }

        h1{

            text-align:center;

            margin-bottom:10px;

            font-size:32px;
        }

        p{

            text-align:center;

            margin-bottom:30px;

            color:#cbd5e1;
        }

        .input-group{

            margin-bottom:20px;

            position:relative;
        }

        .input-group i{

            position:absolute;

            left:15px;
            top:17px;

            color:#94a3b8;
        }

        input{

            width:100%;

            padding:15px 15px 15px 45px;

            border:none;

            border-radius:12px;

            outline:none;

            background:rgba(255,255,255,0.12);

            color:white;

            font-size:15px;
        }

        input::placeholder{
            color:#cbd5e1;
        }

        .login-btn{

            width:100%;

            padding:15px;

            border:none;

            border-radius:12px;

            background:#38bdf8;

            color:white;

            font-size:16px;

            font-weight:bold;

            cursor:pointer;

            transition:0.3s;

            margin-top:10px;
        }

        .login-btn:hover{

            transform:scale(1.02);

            background:#0ea5e9;
        }

        .view-btn{

            background:#22c55e;
        }

        .view-btn:hover{

            background:#16a34a;
        }

        .bottom-text{

            text-align:center;

            margin-top:20px;

            color:#cbd5e1;

            font-size:14px;
        }

    </style>

</head>
<body>

<div class="login-card">

    <div class="logo">
        <i class="fa-solid fa-user-shield"></i>
    </div>

    <h1>Admin Login</h1>

    <p>
        Stock Dashboard Secure Access
    </p>


    <form method="POST"
          action="/admin/login">

        <div class="input-group">

            <i class="fa-solid fa-envelope"></i>

            <input
                type="email"
                name="email"
                placeholder="Admin Email"
                required
            >

        </div>


        <div class="input-group">

            <i class="fa-solid fa-lock"></i>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

        </div>


        <button class="login-btn">

            Admin Login

        </button>

    </form>


    <a href="/board/main">

        <button
            type="button"
            class="login-btn view-btn"
        >

            View Stock

        </button>

    </a>


    <div class="bottom-text">

        Authorized Admin Access Only

    </div>

</div>

</body>
</html>
